services:
  postgres:
    image: postgres:17
    container_name: issue-refiner-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: issue_refiner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    restart: unless-stopped

volumes:
  postgres_data:
      